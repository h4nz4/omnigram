# Push a tag matching pyproject's version (git tag v0.2.0 && git push origin v0.2.0):
# tests on Linux, builds every platform with build.py, and leaves a draft GitHub Release with the
# builds attached. Write the notes and publish it by hand.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  PYTHON: "3.13"  # Nuitka 4.1.1 (the version PySide6 6.11 validates) supports 3.14 only experimentally
  QT_LIBS: libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ env.PYTHON }}
      - name: Tag matches pyproject version
        run: |
          version=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject.toml version $version"
            exit 1
          fi
      - run: sudo apt-get update && sudo apt-get install -y $QT_LIBS
      - run: uv run pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ env.PYTHON }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf $QT_LIBS
      - run: uv run --extra gui --group build python build.py
      - uses: actions/upload-artifact@v7
        with:
          name: omnigram-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Draft release
        run: gh release create "$GITHUB_REF_NAME" --draft --title "Omnigram ${GITHUB_REF_NAME#v}" --notes "" dist/*
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
